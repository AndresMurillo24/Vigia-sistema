# Proyecto: Vigía · Sistema de alerta sísmica temprana
# Archivo:  .github/workflows/pruebas.yml
# Tipo:     YAML (GitHub Actions)
# Qué hace: Integración continua. Cada vez que se sube un cambio o se abre un Pull Request,
#           GitHub instala el proyecto y ejecuta todas las pruebas en Node.js 22 y 24.
name: Pruebas

on:
  push:
    branches: [main]
  pull_request:

jobs:
  pruebas:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm audit --omit=dev --audit-level=high
